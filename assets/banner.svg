<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030308"/>
      <stop offset="40%" style="stop-color:#0a0618"/>
      <stop offset="75%" style="stop-color:#06101f"/>
      <stop offset="100%" style="stop-color:#030308"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="35%" style="stop-color:#7c3aed"/>
      <stop offset="70%" style="stop-color:#bf5af2"/>
      <stop offset="100%" style="stop-color:#ff2d92"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)" rx="0"/>
  <ellipse cx="120" cy="140" rx="220" ry="130" fill="url(#glow-cyan)" filter="url(#blur)"/>
  <ellipse cx="1050" cy="60" rx="280" ry="150" fill="#ff2d92" opacity="0.07" filter="url(#blur)"/>
  <ellipse cx="600" cy="250" rx="400" ry="90" fill="#7c3aed" opacity="0.12" filter="url(#blur)"/>
  <rect x="60" y="268" width="1080" height="2" fill="url(#accent)" opacity="0.85" rx="1"/>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#accent)" letter-spacing="6" filter="url(#text-glow)">F A I A Z</text>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#accent)" letter-spacing="6" filter="url(#text-glow)">Z A H I N</text>
  <text x="600" y="210" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#8b9cb3" letter-spacing="6">AI · DATA · FULL STACK · DHAKA</text>
  <text x="600" y="240" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4a5568">// architecting intelligent systems</text>
</svg>
